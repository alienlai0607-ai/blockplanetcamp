<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#fff8e9">
  <title>開始報名｜2027 布拉克星球冬令營</title>
  <meta name="description" content="挑選喜歡的冬令營，查看上課日期與教室，直接前往 Google 表單報名。">
  <link rel="canonical" href="https://blockplanetcamp.com/camp2027/register.html">
  <link rel="icon" href="assets/brand-logo.png">
  <link rel="stylesheet" href="register.css?v=20261020-1900">
  <script src="camp-data.js?v=game-lab-storytelling-20261020" defer></script>
  <script src="coupon-config.js?v=fees-pending-20261019" defer></script>
  <script src="register.js?v=registration-forms-20261020" defer></script>
</head>
<body>
  <a class="skip-link" href="#registration">跳至營隊報名</a>
  <header class="registration-header page-width">
    <a class="brand" href="index.html" data-home-link aria-label="布拉克星球冬令營首頁">
      <span>布拉克星球</span><small>2027 冬令營</small>
    </a>
    <a class="back-link" href="index.html" data-home-link><span aria-hidden="true">←</span> 回營隊首頁</a>
  </header>
  <main class="page-width" id="registration">
    <div class="registration-heading">
      <h1>開始報名</h1>
      <p>挑選一個喜歡的營隊吧</p>
      <p>各營隊費用確認後公布；報名金額請等候教室確認後再付款。</p>
    </div>
    <aside class="registration-coupon" aria-labelledby="registrationCouponTitle">
      <div>
        <h2 id="registrationCouponTitle">冬令營 95 折優惠券</h2>
        <p id="registrationCouponStatus">開放時間另行公告</p>
      </div>
      <a href="coupon.html" data-coupon-link>查看優惠券 <span aria-hidden="true">→</span></a>
    </aside>
    <div class="registration-toolbar">
      <div class="campus-filters" role="group" aria-label="依教室篩選營隊">
        <button type="button" data-campus="all" aria-pressed="true">全部教室</button>
        <button type="button" data-campus="north" aria-pressed="false">北區教室</button>
        <button type="button" data-campus="yongkang" aria-pressed="false">永康東橋教室</button>
      </div>
      <p class="camp-count" id="campCount" role="status" aria-live="polite" aria-atomic="true"></p>
    </div>
    <div class="registration-list" id="registrationList" aria-label="營隊報名列表"></div>
    <noscript><p class="load-message">請開啟瀏覽器的 JavaScript，即可查看營隊與報名連結。</p></noscript>
  </main>
  <footer class="registration-footer page-width">
    <span>布拉克星球 · 2027 冬令營</span>
    <a href="https://lin.ee/zFqqFzQ" target="_blank" rel="noopener noreferrer">LINE 洽詢 <span aria-hidden="true">↗</span></a>
  </footer>
</body>
</html>
