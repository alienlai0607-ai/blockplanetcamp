<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive"><meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; connect-src https://script.google.com https://script.googleusercontent.com; img-src 'self' data:; frame-src 'self' about:; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>2027 冬令營｜主管檢視</title>
<style>
:root{--ink:#283e3d;--muted:#687671;--green:#315f54;--paper:#fffefa;--line:#dce1d7;--bg:#f5f4ee;--accent:#a65338}*{box-sizing:border-box}body{margin:0;color:var(--ink);background:var(--bg);font:16px/1.6 system-ui,-apple-system,"Noto Sans TC",sans-serif}button,input,select{font:inherit}button{cursor:pointer}button:disabled{cursor:wait;opacity:.55}button,input,select{min-height:44px;border-radius:10px;border:1px solid var(--line);background:var(--paper);color:var(--ink);padding:10px 15px}button:hover{border-color:var(--green);background:#eff4ee}button.primary{background:var(--green);color:white;border-color:var(--green)}:focus-visible{outline:3px solid #b97739;outline-offset:3px}[hidden]{display:none!important}.wrap{max-width:1240px;margin:auto;padding:34px 30px 60px}header{display:flex;justify-content:space-between;align-items:center;gap:24px;border-bottom:1px solid var(--line);padding-bottom:25px}.eyebrow{color:var(--green);font-weight:700;letter-spacing:.12em;font-size:13px;margin:0 0 6px}h1{font-size:30px;line-height:1.3;margin:0 0 8px;letter-spacing:.02em}h2{font-size:23px;margin:0}h3{font-size:18px;margin:0}p{margin:0}.muted{color:var(--muted);font-size:14px}.tools{display:flex;gap:8px;flex-wrap:wrap}.status{margin:18px 0;display:flex;justify-content:space-between;gap:12px;color:var(--muted);font-size:14px;flex-wrap:wrap}.status strong{color:var(--green)}.notice{padding:15px 18px;background:#fff0d6;color:#805625;border:1px solid #e7cc9c;border-radius:10px;margin:18px 0}.intro-error{padding:55px 25px;border:1px solid var(--line);border-radius:18px;background:var(--paper);text-align:center}.intro-error h2{margin-bottom:12px}.stats{display:grid;grid-template-columns:1.25fr 1fr 1fr;gap:14px;margin:22px 0 28px}.stat{border:1px solid var(--line);border-radius:14px;padding:22px;background:var(--paper)}.stat.main{background:var(--green);color:white;border-color:var(--green)}.stat span{font-size:14px;display:block;min-height:36px}.stat strong{font-size:37px;line-height:1.3;display:block;margin-top:8px;font-variant-numeric:tabular-nums}.stat small{font-size:15px;font-weight:400;margin-left:7px}.section-head{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:14px;flex-wrap:wrap}.section-head p{color:var(--muted);font-size:14px}.camps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.camp{position:relative;text-align:left;display:flex;flex-direction:column;padding:20px;border-radius:14px;min-width:0;transition:background .15s,border-color .15s}.camp[aria-pressed=true]{border:2px solid var(--green);padding:19px;background:#edf3ed}.camp .ordinal{font-size:12px;letter-spacing:.1em;color:var(--accent);margin-bottom:8px}.camp .name{font-weight:750;line-height:1.45;min-height:53px;font-size:18px}.camp .date{font-size:13px;color:var(--muted);margin:5px 0 18px}.camp .numbers{display:flex;justify-content:space-between;align-items:end;gap:8px}.camp .number{font-size:30px;line-height:1;font-weight:750;font-variant-numeric:tabular-nums}.camp .number small{font-size:13px;font-weight:400;margin-left:5px}.camp .new{font-size:12px;color:var(--green);background:#e2ebe1;padding:3px 8px;border-radius:6px}.camp .view{display:block;margin-top:18px;padding-top:11px;border-top:1px solid var(--line);font-size:13px;color:var(--green);font-weight:650}.camp .campus-breakdown{font-size:12px;color:var(--muted);margin-top:12px;min-height:20px}.roster{margin-top:32px;border:1px solid var(--line);border-radius:16px;background:var(--paper);padding:24px}.filters{display:grid;grid-template-columns:180px 1fr auto;gap:12px;align-items:end;border-bottom:1px solid var(--line);padding:16px 0 22px;margin-bottom:18px}.filters label{display:grid;gap:5px;font-size:13px;font-weight:650}.filters input,.filters select{width:100%}.roster-group{margin:22px 0}.group-head{display:flex;align-items:baseline;gap:12px;justify-content:space-between;margin:15px 0 10px}.group-head span{font-size:14px;color:var(--green);white-space:nowrap}.table-wrap{border:1px solid var(--line);border-radius:9px;overflow:hidden}table{width:100%;border-collapse:collapse;font-size:15px;text-align:left}th{background:#eef1e9;font-size:13px;color:var(--muted);font-weight:650}th,td{padding:12px 14px;border-bottom:1px solid var(--line)}tr:last-child td{border-bottom:0}th:first-child,td:first-child{width:55px;color:var(--muted)}td:nth-child(2){font-weight:650}td{overflow-wrap:anywhere}.empty{color:var(--muted);text-align:center;padding:25px}.footer{font-size:12px;color:var(--muted);text-align:center;margin:25px 0}iframe.print-frame{position:fixed;width:1px;height:1px;left:-1000px;border:0}
@media(max-width:760px){.wrap{padding:24px 16px 40px}header{display:block}header .tools{margin-top:18px}h1{font-size:26px}.stats{gap:8px}.stat{padding:15px 12px}.stat strong{font-size:29px}.stat span{font-size:12px}.stat small{font-size:12px;margin-left:3px}.camps{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.camp{padding:15px}.camp[aria-pressed=true]{padding:14px}.camp .name{font-size:16px;min-height:70px}.camp .date{font-size:12px;min-height:38px;margin-bottom:10px}.camp .new{font-size:11px;padding:2px 5px}.camp .number{font-size:26px}.camp .campus-breakdown{min-height:38px}.camp .view{margin-top:10px}.roster{padding:17px 12px}.filters{grid-template-columns:1fr 1fr;gap:10px}.filters .tools{grid-column:1/-1}.filters button{flex:1}th,td{padding:10px 7px;font-size:13px}th:first-child,td:first-child{width:32px}.group-head h3{font-size:16px}.section-head h2{font-size:21px}.status{font-size:12px}}
</style>
</head>
<body>
<main class="wrap">
<header><div><p class="eyebrow">布拉克星球 · 2027 WINTER CAMP</p><h1>冬令營報名總覽</h1><p class="muted">主管檢視版 · 人數與名單</p></div><div class="tools"><button id="refresh">更新人數</button><button id="printAll" class="primary" disabled>列印完整名單</button></div></header>
<div id="demoNote" class="notice" hidden>畫面預覽：以下皆為示範學員與示範人數，並非真實報名資料。</div>
<div class="status" role="status"><span id="connection">準備讀取名單</span><span id="updated">開啟期間每分鐘自動更新</span></div>
<div id="warning" class="notice" role="alert" hidden></div>
<section id="gate" class="intro-error" hidden><h2 id="gateTitle">請使用主管專屬連結</h2><p id="gateText" class="muted">請向管理者取得完整連結，即可免登入查看人數與名單。</p></section>
<div id="dashboard" hidden>
<section class="stats" aria-label="報名統計"><div class="stat main"><span>總報名人次</span><strong id="total">—</strong></div><div class="stat"><span>近 24 小時新增</span><strong id="new24">—</strong></div><div class="stat"><span>近 7 天新增</span><strong id="new7">—</strong></div></section>
<div class="section-head"><h2>各營隊人數</h2><p>點選營隊查看名單 · 跨營報名分別計算</p></div>
<section id="camps" class="camps" aria-label="六個營隊"></section>
<section class="roster" id="roster"><div class="section-head"><div><h2 id="rosterTitle">完整報名名單</h2><p id="rosterCount"></p></div><button id="showAll">查看全部營隊</button></div>
<div class="filters"><label>教室<select id="campus"><option value="">全部教室</option><option>永康東橋教室</option><option>北區教室</option><option>教室待確認</option></select></label><label>搜尋學員<input id="search" type="search" placeholder="輸入學員姓名" autocomplete="off"></label><div class="tools"><button id="printFiltered">列印目前名單</button></div></div>
<div id="rosterList"></div></section>
<p class="footer">統計依目前未刪除的報名紀錄計算；同一學員跨營報名分別列入各營隊。<br>名單僅供內部管理使用。</p>
</div>
</main>
<script>
'use strict';
const ENDPOINT='https://script.google.com/macros/s/AKfycbw0seQA-F9j2TzTKO6ylWA8XdbF_51uKAsXxF4iZP26pj4eAo6stAXdO4R15uVClHc-/exec';
const $=s=>document.querySelector(s),esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const key=new URLSearchParams(location.hash.slice(1)).get('key')||'',demo=new URLSearchParams(location.search).get('demo')==='1';
let snapshot=null,selected='',busy=false,stopped=false,printFrame=null;
const time=s=>new Date(s).toLocaleString('zh-TW',{timeZone:'Asia/Taipei',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false});
const date=s=>new Date(s).toLocaleDateString('zh-TW',{timeZone:'Asia/Taipei',month:'numeric',day:'numeric'});
const dates=c=>c.dates.length?c.dates[0].replace('2027-','').replace('-','/')+'–'+c.dates[c.dates.length-1].replace('2027-','').replace('-','/'):'日期待確認';
function recent(rows,days){const cutoff=Date.parse(snapshot.generatedAt)-days*86400000;return rows.filter(x=>Date.parse(x.submittedAt)>=cutoff&&Date.parse(x.submittedAt)<=Date.parse(snapshot.generatedAt)).length;}
function filtered(){return snapshot.rows.filter(x=>(!selected||x.campId===selected)&&(!$('#campus').value||x.classroom===$('#campus').value)&&x.name.toLowerCase().includes($('#search').value.trim().toLowerCase()));}
function tables(rows){return snapshot.camps.filter(c=>(!selected||selected===c.id)&&rows.some(r=>r.campId===c.id)).map(c=>{let list=rows.filter(x=>x.campId===c.id);return '<section class="roster-group"><div class="group-head"><h3>'+esc(c.name)+'</h3><span>'+list.length+' 人次</span></div><div class="table-wrap"><table><thead><tr><th scope="col">序</th><th scope="col">學員姓名</th><th scope="col">教室</th><th scope="col">報名日期</th></tr></thead><tbody>'+list.map((r,i)=>'<tr><td>'+(i+1)+'</td><td>'+esc(r.name)+'</td><td>'+esc(r.classroom)+'</td><td>'+esc(date(r.submittedAt))+'</td></tr>').join('')+'</tbody></table></div></section>';}).join('')||'<p class="empty">目前沒有符合條件的報名紀錄。</p>';}
function renderRoster(){const rows=filtered(),c=snapshot.camps.find(c=>c.id===selected);$('#rosterTitle').textContent=c?c.name:'完整報名名單';$('#rosterCount').textContent=rows.length+' 人次'+($('#campus').value?' · '+$('#campus').value:'');$('#rosterList').innerHTML=tables(rows);$('#printFiltered').disabled=!rows.length;$('#showAll').hidden=!selected;document.querySelectorAll('[data-camp]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.camp===selected)));}
function render(){ $('#gate').hidden=true;$('#dashboard').hidden=false;$('#printAll').disabled=!snapshot.rows.length;
$('#total').innerHTML=snapshot.rows.length+'<small>人次</small>';$('#new24').innerHTML=recent(snapshot.rows,1)+'<small>人次</small>';$('#new7').innerHTML=recent(snapshot.rows,7)+'<small>人次</small>';
$('#camps').innerHTML=snapshot.camps.map((c,i)=>{const rows=snapshot.rows.filter(x=>x.campId===c.id),n=recent(rows,1),breakdown=['永康東橋教室','北區教室','教室待確認'].map(label=>{let total=rows.filter(r=>r.classroom===label).length;return total?label.replace('永康','').replace('教室','')+' '+total:'';}).filter(Boolean).join(' · ');return '<button class="camp" data-camp="'+esc(c.id)+'" aria-pressed="'+String(c.id===selected)+'"><span class="ordinal">CAMP 0'+(i+1)+'</span><span class="name">'+esc(c.name)+'</span><span class="date">'+esc(dates(c))+'</span><span class="numbers"><span class="number">'+rows.length+'<small>人次</small></span>'+(n?'<span class="new">24h +'+n+'</span>':'')+'</span><span class="campus-breakdown">'+esc(breakdown||'目前尚無報名')+'</span><span class="view">'+(c.id===selected?'正在查看名單':'查看此營隊名單')+'</span></button>';}).join('');renderRoster();$('#updated').textContent='資料更新 '+time(snapshot.generatedAt)+' · 每分鐘自動更新';}
function failGate(title,message){$('#gate').hidden=false;$('#gateTitle').textContent=title;$('#gateText').textContent=message;$('#dashboard').hidden=true;$('#printAll').disabled=true;}
async function refresh(){if(busy||stopped||demo||document.hidden)return;if(!/^[a-f0-9]{64}$/.test(key)){stopped=true;$('#connection').textContent='尚未開啟專屬連結';failGate('請使用主管專屬連結','請向管理者取得完整連結，即可免登入查看人數與名單。');return;}
busy=true;$('#refresh').disabled=true;$('#connection').textContent=snapshot?'正在更新人數…':'正在讀取六個營隊的報名名單…';const controller=new AbortController(),timeout=setTimeout(()=>controller.abort(),55000);
try{const response=await fetch(ENDPOINT,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'supervisorRead',campaignId:'2027C',key}),credentials:'omit',referrerPolicy:'no-referrer',cache:'no-store',signal:controller.signal});if(!response.ok)throw Error('NETWORK');const r=await response.json();if(!r.success)throw Error(r.errorCode||'NETWORK');if(r.campaignId!=='2027C'||!Array.isArray(r.rows)||!Array.isArray(r.camps)||r.camps.length!==6)throw Error('INVALID_DATA');snapshot=r;render();$('#warning').hidden=!r.stale;$('#warning').textContent='目前連線較慢，以下保留上次成功更新的名單；恢復連線後會自動更新。';$('#connection').textContent=r.stale?'顯示上次成功更新資料':'● 已連線 · 自動更新中';}
catch(e){if(e.message==='SUPERVISOR_ACCESS_DENIED'){stopped=true;snapshot=null;$('#camps').replaceChildren();$('#rosterList').replaceChildren();$('#warning').hidden=true;failGate('此連結未開通或已停用','請向管理者取得最新的主管專屬連結。');$('#connection').textContent='連結無法使用';}else{$('#warning').hidden=false;$('#warning').textContent=snapshot?'暫時無法取得最新資料，以下保留上次名單，稍後會自動重試。':'目前讀取較慢，系統會自動重試，也可以按「更新人數」。';$('#connection').textContent='等待重新連線';if(!snapshot)failGate('名單暫時無法讀取','目前無法確認最新人數，不會將讀取失敗顯示為 0 人。');}}
finally{clearTimeout(timeout);busy=false;$('#refresh').disabled=stopped;}}
function printRoster(all){if(!snapshot)return;let previous=selected;if(all)selected='';const rows=all?snapshot.rows:filtered(),content=tables(rows);selected=previous;if(!rows.length)return;if(printFrame)printFrame.remove();printFrame=document.createElement('iframe');printFrame.className='print-frame';printFrame.title='列印營隊名單';printFrame.srcdoc='<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="referrer" content="no-referrer"><title>2027 冬令營名單</title><style>@page{size:A4;margin:14mm}body{font:13px/1.5 system-ui,sans-serif;color:#222}h1{font-size:22px}h3{font-size:16px;margin:18px 0 6px}.group-head{display:flex;justify-content:space-between;align-items:baseline}table{border-collapse:collapse;width:100%}th,td{border-bottom:1px solid #ccc;padding:8px;text-align:left}th{background:#eee}thead{display:table-header-group}tr{break-inside:avoid}h3,.group-head{break-after:avoid}p{color:#555}</style><h1>2027 冬令營 · '+(all?'完整報名名單':'篩選名單')+'</h1><p>'+(demo?'示範資料 · ':'')+'共 '+rows.length+' 人次 · 資料更新 '+esc(time(snapshot.generatedAt))+(snapshot.stale?'（上次成功資料）':'')+'</p>'+content+'<p>同一學員跨營報名分別計算。內部管理資料，請妥善保管。</p></html>';printFrame.onload=()=>{printFrame.contentWindow.focus();printFrame.contentWindow.print();};document.body.append(printFrame);}
$('#refresh').addEventListener('click',refresh);$('#printAll').addEventListener('click',()=>printRoster(true));$('#printFiltered').addEventListener('click',()=>printRoster(false));$('#campus').addEventListener('change',renderRoster);$('#search').addEventListener('input',renderRoster);$('#showAll').addEventListener('click',()=>{selected='';renderRoster();});$('#camps').addEventListener('click',e=>{let b=e.target.closest('[data-camp]');if(!b)return;selected=b.dataset.camp;renderRoster();$('#roster').scrollIntoView({behavior:'smooth',block:'start'});});document.addEventListener('visibilitychange',()=>{if(!document.hidden)refresh();});window.addEventListener('online',refresh);setInterval(refresh,60000);
if(demo){$('#demoNote').hidden=false;const ids=['full-term','drone','lego','game-lab','aviation','fragrance'],names=['五燈獎・大聖鬧辦桌','祥龍無人機派對','LEGO IDEAS 玩具設計總監','Game Lab｜遊戲設計師養成營','「機」不可失｜飛行航空科學營','小小生活工藝師｜新春香氛科學營'];snapshot={generatedAt:new Date().toISOString(),camps:ids.map((id,i)=>({id,name:names[i],dates:i===0?['2027-01-21','2027-02-02']:i<3?['2027-01-25','2027-01-29']:['2027-01-21','2027-01-22']})),rows:ids.flatMap((id,i)=>Array.from({length:[18,12,8,6,5,7][i]},(_,j)=>({name:'示範學員 '+String(j+1).padStart(2,'0'),campId:id,classroom:i===4?'永康東橋教室':i===1||i===3||i===5?'北區教室':j%2?'北區教室':'永康東橋教室',submittedAt:new Date(Date.now()-(j+i)*86400000/2).toISOString()})))};render();$('#connection').textContent='畫面預覽 · 示範資料';$('#refresh').hidden=true;}else refresh();
</script>
</body></html>
